<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 PlantGuard AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">
      <span class="logo-leaf">🌿</span>
      <span>PlantGuard AI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/"          class="nav-link {% if request.path == '/' %}active{% endif %}">🔍 Detect</a></li>
      <li><a href="/history"   class="nav-link {% if request.path == '/history' %}active{% endif %}">📜 History</a></li>
      <li><a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">📊 Dashboard</a></li>
    </ul>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/js/app.js"></script>
</body>
</html>
